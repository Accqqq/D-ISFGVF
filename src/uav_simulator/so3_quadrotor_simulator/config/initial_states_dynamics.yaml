# Flat layout (all yaw = 0) for the command-isolation / timeout tests:
# the SO3 controller needs the commanded orientation to be consistent with
# the agent's hover yaw, so dynamic tests use yaw = 0 agents.
initial_states:
  - robot_id: 0
    name: uav_0
    x: 0.0
    y: 0.0
    z: 1.0
    yaw: 0.0
  - robot_id: 1
    name: uav_1
    x: 4.0
    y: 0.0
    z: 1.0
    yaw: 0.0
  - robot_id: 2
    name: uav_2
    x: -4.0
    y: 0.0
    z: 1.0
    yaw: 0.0
